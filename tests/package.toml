[package]
package_id = "org.rinos.rinpack-test"
display_name = "Rinpack Test"
version = "1.2.3"
architecture = "any"
package_type = "application"
description = "Native package builder test."
license = "MIT"
homepage = "https://example.invalid/rinpack"
min_rinos_version = "1.0"
max_rinos_version = ""
dependencies = [{name = "org.rinos.base", min_version = "1.0", max_version = "2.0"}]
optional_dependencies = []
conflicts = []
provides = ["test-package"]
entry_points = [{name = "main", path = "bin/main.rin"}]
flags = ["security"]
capabilities = ["dac-override", "chown", "system-admin", "driver-broker", "service-control", "gui-control", "process-control", "network-admin", "crash-diagnostic", "storage-manage", "package-manage", "rin-pass", "keyring-master", "power-control", "system-info", "network-access", "clipboard", "notification", "gpu-access", "microphone", "camera", "midi", "location", "file-portal", "theme-control", "accessibility", "display", "desktop", "audio-output", "debugging", "profiling"]

[[files]]
path = "bin/main.rin"
source = "main.rin"
